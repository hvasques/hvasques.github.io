<head>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Funnel+Display:wght@700;800&family=Funnel+Sans:wght@400;500;600&family=Geologica:wght@400;500&display=swap">
<style>
body{margin:0;background:#EEF1F3}
a{color:#1B2433}a:hover{color:#C2461F}
.route-line{stroke-dasharray:8 9;animation:run 1.8s linear infinite}
@keyframes run{to{stroke-dashoffset:-34}}
@media (prefers-reduced-motion: reduce){.route-line{animation:none}}
@media (max-width:1100px){.copy{max-width:46% !important}}
@media (max-width:860px){.wall{display:none}.copy{max-width:100% !important}.nav{gap:18px !important}.shell{padding-left:20px !important;padding-right:20px !important}}
</style>
</helmet>
<div style="position: relative; min-height: max(760px, 100vh); width: 100%; overflow: hidden; background: #EEF1F3; color: #1B2433; font-family: Geologica, system-ui, sans-serif;">

  <!-- Cave roof: spans the full width; its height scales with the page height, like the wall, so the two always meet at the same place -->
  <svg aria-hidden="true" viewBox="0 0 1280 150" preserveAspectRatio="none" style="position: absolute; z-index: 1; top: 0; left: 0; width: 100%; height: calc(100% * 150 / 760); display: block;">

    <polyline fill="none" stroke="#A3AEB9" stroke-width="1.5" vector-effect="non-scaling-stroke" points="0,70 180,84 380,72 560,90 760,80 980,96 1280,86"></polyline>
  </svg>

  <!-- Overhang: anchored to the right edge, sized by the page height -->
  <svg class="wall" aria-hidden="true" viewBox="0 0 520 760" preserveAspectRatio="xMaxYMin meet" style="position: absolute; z-index: 0; top: 0; right: 0; height: 100%; aspect-ratio: 520 / 760; display: block;">
    <polygon fill="#C9D0D6" points="0,0 520,0 520,760 410,760 350,660 298,570 252,480 206,390 164,300 124,212 84,160 40,136 0,128"></polygon>
    <g fill="none" stroke="#A3AEB9" stroke-width="1.5">
      <polyline points="520,250 430,262 330,300 250,310"></polyline>
      <polyline points="520,420 440,440 360,470 310,480"></polyline>
      <polyline points="520,600 460,620 410,660"></polyline>
      <polyline points="150,170 220,150 320,160 520,140"></polyline>
    </g>
    <!-- Other holds on the wall (not part of the route) -->
    <g fill="#A3AEB9">
      <polygon points="-9,-6 8,-8 9,5 -7,7" transform="translate(505 690) rotate(15)"></polygon>
      <polygon points="-12,-8 10,-12 12,7 -8,12" transform="translate(452 636) rotate(-30) scale(0.8)"></polygon>
      <polygon points="-13,-2 -4,-12 12,-7 9,10 -9,9" transform="translate(505 606) rotate(20) scale(0.8)"></polygon>
      <polygon points="-15,-4 0,-10 15,-4 10,8 -11,8" transform="translate(402 522) rotate(-15) scale(0.8)"></polygon>
      <polygon points="-9,-6 8,-8 9,5 -7,7" transform="translate(348 472) rotate(30)"></polygon>
      <polygon points="-11,-10 9,-9 12,3 2,11 -10,6" transform="translate(296 438) rotate(-10) scale(0.8)"></polygon>
      <polygon points="-12,-8 10,-12 12,7 -8,12" transform="translate(505 400) rotate(10) scale(0.8)"></polygon>
      <polygon points="-9,-6 8,-8 9,5 -7,7" transform="translate(420 352) rotate(-25)"></polygon>
      <polygon points="-13,-9 11,-11 13,4 7,11 -12,9 -13,-2" transform="translate(474 326) rotate(35) scale(0.7)"></polygon>
      <polygon points="-11,-10 9,-9 12,3 2,11 -10,6" transform="translate(236 350) rotate(20) scale(0.8)"></polygon>
      <polygon points="-15,-4 0,-10 15,-4 10,8 -11,8" transform="translate(386 250) rotate(-20) scale(0.8)"></polygon>
      <polygon points="-9,-6 8,-8 9,5 -7,7" transform="translate(500 242) rotate(10)"></polygon>
      <polygon points="-12,-8 10,-12 12,7 -8,12" transform="translate(256 180) rotate(25) scale(0.8)"></polygon>
      <polygon points="-13,-2 -4,-12 12,-7 9,10 -9,9" transform="translate(330 196) rotate(-15) scale(0.7)"></polygon>
      <polygon points="-9,-6 8,-8 9,5 -7,7" transform="translate(410 192) rotate(40)"></polygon>
      <polygon points="-11,-10 9,-9 12,3 2,11 -10,6" transform="translate(478 176) rotate(-5) scale(0.8)"></polygon>
    </g>
    <!-- The route: starts low right, traverses left, swings back right, then follows the roof out to the lip -->
    <path class="route-line" d="M478 732 C 468 723, 434 695, 420 680 C 406 665, 387 659, 392 640 C 397 621, 434 586, 450 566 C 466 546, 490 543, 488 520 C 486 497, 459 448, 440 428 C 421 408, 392 418, 372 400 C 352 382, 335 341, 318 322 C 301 303, 290 303, 270 288 C 250 273, 222 253, 196 230 C 170 207, 140 188, 128 178" fill="none" stroke="{{path}}" stroke-width="4" stroke-linecap="round"></path>
    <g fill="{{path}}">
      <polygon points="-13,-9 11,-11 13,4 7,11 -12,9 -13,-2" transform="translate(478 732)"></polygon>
      <polygon points="-12,-8 10,-12 12,7 -8,12" transform="translate(420 680) rotate(-15)"></polygon>
      <polygon points="-9,-6 8,-8 9,5 -7,7" transform="translate(392 640) rotate(30)"></polygon>
      <polygon points="-15,-4 0,-10 15,-4 10,8 -11,8" transform="translate(450 566) rotate(-20)"></polygon>
      <polygon points="-11,-10 9,-9 12,3 2,11 -10,6" transform="translate(488 520) rotate(-20)"></polygon>
      <polygon points="-13,-9 11,-11 13,4 7,11 -12,9 -13,-2" transform="translate(440 428) rotate(25)"></polygon>
      <polygon points="-9,-6 8,-8 9,5 -7,7" transform="translate(372 400) rotate(-20)"></polygon>
      <polygon points="-15,-4 0,-10 15,-4 10,8 -11,8" transform="translate(318 322) rotate(10)"></polygon>
      <polygon points="-12,-8 10,-12 12,7 -8,12" transform="translate(270 288) rotate(25)"></polygon>
      <polygon points="-13,-2 -4,-12 12,-7 9,10 -9,9" transform="translate(196 230) rotate(15)"></polygon>
      <polygon points="-16,-11 13,-14 16,5 9,13 -14,11 -16,-2" transform="translate(128 178) rotate(-20)"></polygon>
    </g>
  </svg>

  <div class="shell" style="position: relative; z-index: 2; box-sizing: border-box; padding: 0 64px 56px; display: flex; flex-direction: column; gap: 0;">
    <header style="display: flex; align-items: center; justify-content: space-between; gap: 64px; padding-top: 44px; flex-wrap: wrap; row-gap: 16px;">
      <a href="Main.dc.html" style="font-family: 'Chakra Petch', sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; color: #1B2433;">hvasques<span style="color: {{path}};">/</span></a>
      <nav class="nav" aria-label="Main" style="display: flex; gap: 32px; flex-wrap: wrap; font-family: 'Chakra Petch', sans-serif; font-weight: 500; font-size: 16px; letter-spacing: 0.1em; text-transform: uppercase;">
        <a href="Main.dc.html" aria-current="page" style="text-decoration: none; color: #1B2433; padding-bottom: 6px; box-shadow: inset 0 -3px 0 {{path}};">Home</a>
        <a href="Portfolio.dc.html" style="text-decoration: none; color: #1B2433; padding-bottom: 6px;">Portfolio</a>
        <a href="#about" style="text-decoration: none; color: #1B2433; padding-bottom: 6px;">About</a>
      </nav>
    </header>

    <main class="copy" style="max-width: 600px; margin-top: calc(max(760px, 100vh) * 152 / 760 - 18px); display: flex; flex-direction: column; gap: 24px; align-items: flex-start;">
      <h1 style="margin: 0; font-family: 'Funnel Display', sans-serif; font-weight: 800; font-size: clamp(56px, 8vw, 104px); line-height: 0.92; letter-spacing: -0.03em; color: #1B2433;">Find the next <span style="color: {{path}};">hold</span></h1>
      <p style="margin: 0; font-size: 19px; line-height: 1.55; color: #4C5763; max-width: 34ch;">Projects and experiments from someone who climbs and plays games. Start anywhere on the wall.</p>
      <div style="display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px;">
        <a href="Portfolio.dc.html" style="font-family: 'Chakra Petch', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; padding: 18px 38px 18px 24px; background: {{path}}; color: #FFFFFF; clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 100%, 0 100%);">See the portfolio</a>
      </div>
    </main>
  <svg width="75" height="52" viewBox="0 0 75 52" preserveAspectRatio="none" style="position: absolute; left: 729px; top: 111px; width: 75px; height: 52px; overflow: visible; fill: none; stroke: #8a8378; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M3 9 C3 20.7 2.2 32.6 4 44 C20.1 47.2 36.6 47.6 53 49 C60.1 49.6 67.1 51 74 51 C74.2 46.4 76.5 39.4 75 35 C73.6 30.7 69.8 27.6 67 24 C62.3 18 54.8 6 47 3.3 C43.8 2.1 39.3 3.4 36 3 C21.1 1.3 16 0.3 1 2 C0.2 6.7 0 11.2 0 16" vector-effect="non-scaling-stroke"></path></svg></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"path":{"editor":"color","default":"#C2461F","options":["#C2461F","#D9121A","#1B2433"]},"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return { path: this.props.path ?? '#C2461F' };
  }
}
</script>
</body>
</html>
